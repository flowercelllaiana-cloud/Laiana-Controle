
name: Build Controle Remoto Universal

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - master

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Baixar arquivos
        uses: actions/checkout@v4

      - name: Preparar Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Preparar Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: 'platforms;android-35 build-tools;35.0.0'

      - name: Verificar arquivos
        run: |
          echo "Arquivos encontrados no repositório:"
          find . -maxdepth 3 -type f | head -100

      - name: Localizar projeto Android
        run: |
          ZIP=$(find . -maxdepth 3 -type f -name '*Avancado*.zip' | head -n 1)

          if [ -n "$ZIP" ]; then
            mkdir -p extracted
            unzip -o "$ZIP" -d extracted
            ROOT="extracted"
          else
            ROOT="."
          fi

          SETTINGS=$(find "$ROOT" -name settings.gradle.kts -print -quit)

          if [ -z "$SETTINGS" ]; then
            echo "ERRO: settings.gradle.kts não encontrado."
            echo "Confira se o ZIP do projeto foi enviado ao repositório."
            exit 1
          fi

          PROJECT_DIR="$(dirname "$SETTINGS")"
          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"
          echo "Projeto encontrado em: $PROJECT_DIR"

      - name: Configurar Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Compilar APK
        run: gradle -p "$PROJECT_DIR" assembleDebug

      - name: Disponibilizar APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: ControleRemotoUniversal-APK
          path: extracted/**/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
