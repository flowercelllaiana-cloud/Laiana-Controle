
name: Build Controle Remoto Universal

on:
  workflow_dispatch:
  push:
    branches: [main, master]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Baixar arquivos
        uses: actions/checkout@v4

      - name: Preparar Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Preparar Android SDK
        uses: android-actions/setup-android@v3

      - name: Instalar SDK
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - name: Localizar e extrair projeto
        run: |
          ZIP=$(find . -maxdepth 2 -type f -name '*Avancado*.zip' | head -n 1)
          if [ -z "$ZIP" ]; then
            echo "ERRO: ZIP do projeto não encontrado."
            find . -maxdepth 3 -type f | head -n 100
            exit 1
          fi
          mkdir -p extracted
          unzip -o "$ZIP" -d extracted
          SETTINGS=$(find extracted -name settings.gradle.kts -print -quit)
          if [ -z "$SETTINGS" ]; then
            echo "ERRO: settings.gradle.kts não encontrado após extração."
            find extracted -maxdepth 4 -type f | head -n 100
            exit 1
          fi
          echo "PROJECT_DIR=$(dirname "$SETTINGS")" >> "$GITHUB_ENV"

      - name: Configurar Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Compilar APK
        run: gradle -p "$PROJECT_DIR" assembleDebug

      - name: Disponibilizar APK
        uses: actions/upload-artifact@v4
        with:
          name: ControleRemotoUniversal-APK
          path: extracted/**/app/build/outputs/apk/debug/app-debug.apk
